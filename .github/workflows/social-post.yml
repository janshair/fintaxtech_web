name: Post new blog articles to Facebook and Instagram
# Runs only when a push to main adds a social post file, which the blog routine writes with each new
# article. Code-only pushes do not start it. The site deploys in parallel; the script waits until the
# article is live before posting.
on:
  push:
    branches: [main]
    paths: ['social/posts/*.json']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check the token and show what would be posted, without posting
        type: boolean
        default: true
      slug:
        description: Only this article slug (optional)
        type: string
        required: false
      test_music:
        description: Dry run only - render a Reel with this track id even if the post has no music (optional)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: social-post
  cancel-in-progress: false

jobs:
  post:
    # Edits to an existing post file match the path filter too, but only a new file means a new article.
    if: github.event_name == 'workflow_dispatch' || contains(toJSON(github.event.commits.*.added), 'social/posts/')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Reels need the fonts and Playwright from the project, a Chromium browser to draw frames and
      # ffmpeg to encode. Both are taken from the runner image when it has them, so nothing comes from
      # the Ubuntu package mirror, which can stall for many minutes.
      - run: pnpm install --frozen-lockfile
      - name: Find a browser for rendering Reels
        timeout-minutes: 5
        run: |
          for b in google-chrome google-chrome-stable chromium chromium-browser; do
            if p=$(command -v "$b"); then echo "PW_CHROMIUM_PATH=$p" >> "$GITHUB_ENV"; echo "Using $p"; exit 0; fi
          done
          pnpm exec playwright install chromium
      - name: Find ffmpeg
        timeout-minutes: 5
        run: |
          if command -v ffmpeg; then exit 0; fi
          # Static Linux build linked from ffmpeg.org's download page.
          curl -fsSL --retry 3 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ffmpeg-master-latest-linux64-gpl/bin" >> "$GITHUB_PATH"
      - run: node scripts/social-post-meta.mjs
        timeout-minutes: 40
        env:
          META_SYSTEM_TOKEN: ${{ secrets.META_SYSTEM_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          MUSIC_KEY: ${{ secrets.MUSIC_KEY }}
          TEST_MUSIC: ${{ inputs.test_music }}
          REEL_EXPORT_DIR: ${{ runner.temp }}/reel-export
          SOURCE_SHA: ${{ github.sha }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          SLUG: ${{ inputs.slug }}
      # Music-free copy of each Reel, to post by hand on TikTok and YouTube with their own licensed audio.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reel-without-music
          path: ${{ runner.temp }}/reel-export/*.mp4
          if-no-files-found: ignore
          retention-days: 30
